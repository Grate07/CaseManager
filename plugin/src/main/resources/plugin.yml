name: CaseManager
version: 1.0.0
main: me.grate.casemanager.CaseManager
api-version: '1.21'

description: Advanced moderation case management system.
author: Grate

commands:
  case:
    description: Manage moderation cases
    usage: /case <create|view|list|timeline|note>

permissions:

  casemanager.create:
    description: Create moderation cases
    default: op

  casemanager.view:
    description: View moderation cases
    default: op

  casemanager.list:
    description: List moderation cases
    default: op

  casemanager.note:
    description: Add notes to moderation cases
    default: op

  casemanager.use:
    description: Use CaseManager
    default: op
