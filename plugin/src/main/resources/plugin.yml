name: CaseManager
version: 1.0.0
main: me.grate.casemanager.CaseManager
api-version: '1.21'

softdepend:
  - CoreProtect
  - Vulcan
  - LiteBans


description: Advanced moderation case management system.
author: Grate

commands:
  case:
    description: Manage moderation cases
    usage: /case <create|view|list|timeline|note|evidence|assign|unassign|investigators|status>

permissions:

  casemanager.create:
    description: Create moderation cases
    default: op

  casemanager.view:
    description: View moderation cases
    default: op

  casemanager.list:
    description: List moderation cases
    default: op

  casemanager.note:
    description: Add notes to moderation cases
    default: op

  casemanager.evidence:
    description: Add and view case evidence
    default: op

  casemanager.assign:
    description: Assign investigators to cases
    default: op

  casemanager.unassign:
    description: Remove investigators from cases
    default: op

  casemanager.investigators:
    description: View investigators assigned to cases
    default: op

  casemanager.status:
    description: Change moderation case status
    default: op

  casemanager.use:
    description: Use CaseManager
    default: op