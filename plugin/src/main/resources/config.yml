# ============================================================
# CaseManager Configuration
# ============================================================

database:
  host: "YOUR_POOLER_HOST"
  port: 5432
  name: "postgres"
  username: "postgres.YOUR_PROJECT_REF"
  password: "CHANGE_ME"
  pool-size: 5
  ssl: true


# ============================================================
# External Plugin Integrations
# ============================================================

integrations:

  coreprotect:
    enabled: true

    evidence:
      time-seconds: 86400
      limit: 50


  vulcan:
    enabled: true


  litebans:
    enabled: true

    evidence-limit: 20


  floodgate:
    enabled: true


# ============================================================
# Evidence
# ============================================================

evidence:

  # Maximum length for normal text evidence.
  max-content-length: 10000

  # Maximum number of evidence entries returned by a list request.
  list-limit: 100


# ============================================================
# Supabase Storage
# ============================================================

storage:

  # Completely disables media storage when false.
  enabled: true

  # Currently supported:
  #   supabase
  provider: "supabase"

  # Supabase Storage bucket.
  bucket: "case-evidence"

  supabase:

    # Example:
    # https://xxxxxxxxxxxxxxxx.supabase.co
    url: ""

    # IMPORTANT:
    # Use the Supabase server-side secret/service-role key here.
    #
    # Do NOT use the public anon key.
    secret-key: ""


  # ----------------------------------------------------------
  # File limits
  # ----------------------------------------------------------

  # Maximum image size.
  max-image-size-mb: 10

  # Maximum video size.
  max-video-size-mb: 100

  # General safety limit for uploaded files.
  max-file-size-mb: 100


  # ----------------------------------------------------------
  # Signed URLs
  # ----------------------------------------------------------

  # How long generated private-storage URLs remain valid.
  #
  # 3600 = 1 hour
  # 1800 = 30 minutes
  # 7200 = 2 hours
  signed-url-expiry-seconds: 3600


# ============================================================
# Case System
# ============================================================

cases:

  # Maximum number of cases returned by /case list.
  list-limit: 50


# ============================================================
# Debug
# ============================================================

debug:

  enabled: false