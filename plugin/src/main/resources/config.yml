# ============================================================
# CaseManager Configuration
# ============================================================

# CaseManager uses Supabase PostgreSQL as its database.
#
# Recommended connection method for a Minecraft server is the
# Supabase Session Pooler connection shown under:
# Supabase Dashboard -> Connect -> Session pooler
#
# The Session Pooler is IPv4-compatible and is suitable for
# persistent Java/Minecraft server connections.

database:

  # Supabase Session Pooler host.
  # Copy the host exactly from Supabase Dashboard -> Connect.
  host: "YOUR_POOLER_HOST"

  # Supabase Session Pooler session-mode port.
  # Usually 5432. Copy the value from Supabase Dashboard -> Connect.
  port: 5432

  # Supabase database name. Usually "postgres".
  name: "postgres"

  # Session Pooler username.
  # It normally looks like: postgres.YOUR_PROJECT_REF
  username: "postgres.YOUR_PROJECT_REF"

  # Supabase database password.
  # Do not commit a real production password to GitHub.
  password: "CHANGE_ME"

  # Maximum number of connections CaseManager keeps in its local Hikari pool.
  # Keep this modest on the Supabase Free plan.
  pool-size: 5

  # Supabase PostgreSQL should use SSL/TLS.
  ssl: true


# ============================================================
# Integrations
# ============================================================

integrations:

  coreprotect:

    enabled: true

    evidence:
      time-seconds: 86400
      limit: 50


  vulcan:

    enabled: true


  litebans:

    enabled: true
    evidence-limit: 20


  # ----------------------------------------------------------
  # Floodgate / Bedrock Support
  # ----------------------------------------------------------
  #
  # CaseManager does not require Floodgate.
  #
  # When enabled, CaseManager will detect Floodgate if it is
  # installed on the server and can identify Bedrock players.
  #
  # The core plugin remains compatible with:
  # - Spigot
  # - Paper
  # - Purpur
  # - Java players
  # - Bedrock players through Geyser/Floodgate
  #
  # UUID remains the primary player identity.
  #

  floodgate:

    enabled: true


# ============================================================
# Case Evidence
# ============================================================

evidence:

  # Maximum amount of text allowed in normal evidence content.
  max-content-length: 10000

  # Maximum number of evidence entries returned by evidence lists.
  list-limit: 100


# ============================================================
# Evidence Storage
# ============================================================
#
# Actual image/video files are NOT stored inside PostgreSQL.
#
# PostgreSQL stores metadata such as:
#
#   storage_path
#   original_filename
#   mime_type
#   file_size
#
# The actual file will be stored by the configured storage
# provider.
#
# Supabase Storage is the planned provider.
#

storage:

  enabled: true

  # Current storage provider.
  provider: "supabase"

  # Supabase Storage bucket used for case evidence.
  #
  # Create this bucket in:
  # Supabase Dashboard -> Storage
  #
  # We will configure the exact bucket/security model later.
  bucket: "case-evidence"

  # Maximum image upload size.
  max-image-size-mb: 10

  # Maximum video upload size.
  max-video-size-mb: 100


# ============================================================
# Cases
# ============================================================

cases:

  # Maximum number of cases returned by /case list.
  list-limit: 50


# ============================================================
# Debug
# ============================================================

debug:

  enabled: false